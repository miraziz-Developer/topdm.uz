name: SSL Renew (WEB)

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Pin production SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" && test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Issue/renew Let's Encrypt cert on WEB and reload nginx
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.SSH_HOST_1 }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$HOST" '
            set -e
            cd /opt/bozorliii
            bash deploy/bootstrap-ssl.sh
            docker compose -f docker-compose.web.yml up -d --build nginx
          '

      - name: Verify HTTPS
        run: |
          sleep 5
          curl -sf https://bozorliii.online/ -o /dev/null && echo "frontend: OK (valid TLS)" || (echo "frontend: FAILED" && exit 1)
