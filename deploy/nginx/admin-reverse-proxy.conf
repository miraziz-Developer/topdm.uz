server {
    listen 80;
    server_name admin.bozorliii.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.bozorliii.online;

    ssl_certificate /etc/letsencrypt/live/admin.bozorliii.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bozorliii.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass https://103.253.145.151;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
