name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-core:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy CORE (postgres/redis/backend/celery/bot)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST_2 }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$SSH_USER@$HOST" '
            set -e
            cd /opt/bozorliii
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.core.yml up -d --build --remove-orphans
            docker image prune -f
          '

  deploy-web:
    needs: deploy-core
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Deploy WEB (frontend/crm/admin/nginx)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST_1 }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$SSH_USER@$HOST" '
            set -e
            cd /opt/bozorliii
            git fetch origin
            git reset --hard origin/main
            docker compose -f docker-compose.web.yml up -d --build --remove-orphans
            docker image prune -f
          '

  smoke-test:
    needs: [deploy-core, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to settle
        run: sleep 25
      - name: Check live site
        run: |
          curl -sf https://bozorliii.online/ -o /dev/null && echo "frontend: OK" || (echo "frontend: FAILED" && exit 1)
          curl -sf https://api.bozorliii.online/health && echo "" && echo "api: OK" || (echo "api: FAILED" && exit 1)
