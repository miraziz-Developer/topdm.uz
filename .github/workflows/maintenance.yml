name: Maintenance

on:
  workflow_dispatch:
  push:
    branches: [ops-trigger]

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Archive karvon on both servers, sync CORE git state
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          HOST1: ${{ secrets.SSH_HOST_1 }}
          HOST2: ${{ secrets.SSH_HOST_2 }}
        run: |
          set +e
          mkdir -p deploy/_audit
          SSH="sshpass -p $SSH_PASSWORD ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15"

          echo "--- archiving karvon on both servers (move, not delete) ---"
          for pair in "$HOST1:server1" "$HOST2:server2"; do
            HOST="${pair%%:*}"; LABEL="${pair##*:}"
            {
              echo "== ssh connectivity test =="
              $SSH "$SSH_USER@$HOST" 'echo connected as $(whoami) on $(hostname)'
              echo "exit code: $?"
              echo "== karvon archive =="
              $SSH "$SSH_USER@$HOST" '
                set -x
                if [ -d /opt/karvon ]; then
                  mv /opt/karvon /root/karvon-archived-$(date +%Y%m%d)
                  echo "MOVE_RESULT=$?"
                else
                  echo "no /opt/karvon found"
                fi
              '
              echo "exit code: $?"
            } > "deploy/_audit/${LABEL}-karvon.txt" 2>&1
          done

          echo "--- syncing CORE (server2) git state + removing unhealthy unpublished nginx container ---"
          {
            echo "== connectivity =="
            $SSH "$SSH_USER@$HOST2" 'whoami; hostname'
            echo "exit: $?"
            echo "== git before =="
            $SSH "$SSH_USER@$HOST2" 'cd /opt/bozorliii && git log -1 --oneline && git remote -v'
            echo "exit: $?"
            echo "== git fetch =="
            $SSH "$SSH_USER@$HOST2" 'cd /opt/bozorliii && git fetch origin 2>&1'
            echo "exit: $?"
            echo "== git reset --hard =="
            $SSH "$SSH_USER@$HOST2" 'cd /opt/bozorliii && git reset --hard origin/main 2>&1'
            echo "exit: $?"
            echo "== git after =="
            $SSH "$SSH_USER@$HOST2" 'cd /opt/bozorliii && git log -1 --oneline'
            echo "exit: $?"
            echo "== remove unhealthy nginx container =="
            $SSH "$SSH_USER@$HOST2" 'docker rm -f bozorliii-nginx-1 2>&1'
            echo "exit: $?"
          } > "deploy/_audit/server2-sync.txt" 2>&1

          echo "--- capture native nginx config on CORE ---"
          $SSH "$SSH_USER@$HOST2" 'cat /etc/nginx/sites-enabled/admin.bozorliii.online 2>&1; echo "---all proxy_pass---"; grep -R proxy_pass /etc/nginx/sites-enabled/ 2>&1' > "deploy/_audit/server2-nginx-config.txt" 2>&1

          echo "ALL DONE (non-fatal script, see files above for actual results)"
          exit 0

      - name: Commit results
        if: always()
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add deploy/_audit
          git diff --staged --quiet || git commit -m "chore: maintenance run results [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing and retrying ($i)..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
