name: Production Regression

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: production-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run public endpoint smoke tests
        env:
          SITE: https://bozorliii.online
        run: bash scripts/smoke-prod.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Check production routes at all supported viewports
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://bozorliii.online
          PLAYWRIGHT_EXTERNAL_TARGET: "true"
        run: npx playwright test e2e/responsive.spec.ts e2e/smoke.spec.ts

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

      - name: Send production regression failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\"Bozorliii nightly production regression failed. ${RUN_URL}\"}" \
              "$ALERT_WEBHOOK_URL"
          else
            echo "DEPLOY_ALERT_WEBHOOK_URL is not configured; GitHub failure notification remains active."
          fi